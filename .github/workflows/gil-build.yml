name: GIL build
run-name: ${{ (inputs.test_release_ref || inputs.test_source_sha) && 'GIL device test' || 'GIL build' }} / ${{ inputs.test_release_ref || github.event.workflow_run.head_branch || github.ref_name }} / ${{ inputs.test_source_sha || github.event.workflow_run.head_sha || github.sha }}
on:
  push:
    branches: [develop, master, 'release/**', 'hotfix/**', 'test/gil-build/**', 'ci/full/gil-build/**']
  workflow_dispatch:
    inputs:
      test_release_ref:
        description: 'Early device test: protected release/vX.Y.Z or hotfix/vX.Y.Z'
        type: string
        required: false
      test_source_sha:
        description: 'Early device test: exact 40-character current source SHA'
        type: string
        required: false
  workflow_run:
    workflows: [Quality, Licenses]
    types: [completed]
    branches: ['release/**', 'hotfix/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: gil-build-${{ github.event.workflow_run.head_branch || github.ref_name }}-${{ github.event.workflow_run.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  build:
    if: >-
      (github.repository_id == '1429751262' &&
        ((github.event_name == 'workflow_run' && github.ref == 'refs/heads/develop' &&
          github.event.workflow_run.head_repository.id == github.event.repository.id &&
          github.event.workflow_run.event == 'workflow_dispatch' && github.event.workflow_run.conclusion == 'success') ||
         (github.event_name != 'workflow_run' &&
          (github.ref == 'refs/heads/develop' || github.ref == 'refs/heads/master' ||
           startsWith(github.ref, 'refs/heads/release/') || startsWith(github.ref, 'refs/heads/hotfix/') ||
           startsWith(github.ref, 'refs/heads/test/gil-build/'))) ||
         (github.event_name == 'workflow_dispatch' && (inputs.test_release_ref || inputs.test_source_sha) &&
          github.ref == 'refs/heads/ci/gil-test-download/v220-early-download'))) ||
      (github.repository_id == '1460133275' && startsWith(github.ref, 'refs/heads/ci/full/gil-build/'))
    runs-on: windows-2025
    timeout-minutes: 45
    env:
      MILIASTRA_ALLOW_LIVE_WRITE: '0'
      MILIASTRA_SAVE_ROOTS: '[]'
      GIT_LFS_SKIP_SMUDGE: '1'
      SOURCE_SHA: ${{ inputs.test_source_sha || github.event.workflow_run.head_sha || github.sha }}
      SOURCE_REF: ${{ inputs.test_release_ref || github.event.workflow_run.head_branch || github.ref_name }}
    steps:
      - name: Start download measurement
        run: |
          $received = (Get-NetAdapterStatistics | Measure-Object -Property ReceivedBytes -Sum).Sum
          "GIL_START_RX=$([long]$received)" >> $env:GITHUB_ENV
          git config --global core.autocrlf false
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          path: control
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24.18.0'
      - name: Bind the build to its source and release gates
        id: candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GIL_PRODUCTION_WORK_KEY: ${{ vars.GIL_PRODUCTION_WORK_KEY }}
          TEST_RELEASE_REF: ${{ inputs.test_release_ref }}
          TEST_SOURCE_SHA: ${{ inputs.test_source_sha }}
        run: node control/scripts/gil-candidate.mjs preflight
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.candidate.outputs.build == 'true'
        with:
          ref: ${{ env.SOURCE_SHA }}
          path: source
          persist-credentials: false
          sparse-checkout: |
            .github/workflows
            scripts
            src/lua
            data
            config
            tools
            art/characters/traveler-geo/portraits
            art/lowpoly-select
            art/performance
            experiments/lumine-native-fit/fit-hybrid-final
      - name: Fetch and verify the published project GIL
        if: steps.candidate.outputs.build == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SHA256: ${{ steps.candidate.outputs.base_sha256 }}
        run: node ../control/scripts/gil-candidate.mjs base
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        if: steps.candidate.outputs.build == 'true'
        with:
          repository: 8itlab/genshin-miliastra-mcp
          ref: ${{ steps.candidate.outputs.tool_commit }}
          path: miliastra-mcp
          persist-credentials: false
          sparse-checkout-cone-mode: false
          sparse-checkout: |
            /.gitignore
            /src/
            /docs/PLATFORM_RULES.zh-CN.md
            /*.json
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        if: steps.candidate.outputs.build == 'true'
        with:
          node-version: '24.18.0'
          cache: npm
          cache-dependency-path: |
            source/package-lock.json
            miliastra-mcp/npm-shrinkwrap.json
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        if: steps.candidate.outputs.build == 'true'
        with:
          python-version: '3.12.10'
      - name: Install pinned build dependencies
        if: steps.candidate.outputs.build == 'true'
        run: |
          node control/scripts/gil-candidate.mjs toolchain
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix miliastra-mcp ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000 --replace-registry-host=always --registry=https://registry.npmjs.org
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix miliastra-mcp run build:core
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm --prefix source ci --ignore-scripts --prefer-offline --no-audit --no-fund --fetch-retries=0 --fetch-timeout=30000
      - name: Restore source assets and verify clean checkout
        if: steps.candidate.outputs.build == 'true'
        env:
          BASE_SHA256: ${{ steps.candidate.outputs.base_sha256 }}
          CI_LFS_TOKEN: ${{ github.token }}
        run: node control/scripts/gil-candidate.mjs assets
      - name: Build the complete game with native audio
        if: steps.candidate.outputs.build == 'true'
        working-directory: source
        env:
          WORK_KEY: ${{ steps.candidate.outputs.work_key }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.release_version }}
          MILIASTRA_PYTHON: python
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $env:MILIASTRA_MCP_ROOT = (Resolve-Path ../miliastra-mcp).Path
          $timer = [Diagnostics.Stopwatch]::StartNew()
          $buildArguments = @("$env:RUNNER_TEMP/gil-base.gil", 'build/hosted-gil', "--work-key=$env:WORK_KEY")
          if ($env:RELEASE_VERSION) { $buildArguments += '--release-candidate' }
          npm run build:native -- @buildArguments *> "$env:RUNNER_TEMP/gil-native.log"
          if ($LASTEXITCODE -ne 0) {
            node ../control/scripts/gil-candidate.mjs diagnose
            exit 1
          }
          $seconds = $timer.Elapsed.TotalSeconds.ToString('F1', [Globalization.CultureInfo]::InvariantCulture)
          "GIL_BUILD_SECONDS=$seconds" >> $env:GITHUB_ENV
          $received = (Get-NetAdapterStatistics | Measure-Object -Property ReceivedBytes -Sum).Sum
          "GIL_RECEIVED_BYTES=$([long]$received - [long]$env:GIL_START_RX)" >> $env:GITHUB_ENV
      - name: Audit the final GIL
        if: steps.candidate.outputs.build == 'true'
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
          GIL_RELEASE_ARTIFACT: ${{ steps.candidate.outputs.archive }}
          GIL_EARLY_TEST_ARTIFACT: ${{ steps.candidate.outputs.early_test }}
          QUALITY_RUN: ${{ steps.candidate.outputs.quality_run }}
          QUALITY_ATTEMPT: ${{ steps.candidate.outputs.quality_attempt }}
          QUALITY_CHECKOUT_ARTIFACT: ${{ steps.candidate.outputs.quality_checkout_artifact }}
          LICENSES_RUN: ${{ steps.candidate.outputs.licenses_run }}
          BASE_SHA256: ${{ steps.candidate.outputs.base_sha256 }}
          WORK_KEY: ${{ steps.candidate.outputs.work_key }}
          REQUEST_ID: ${{ steps.candidate.outputs.request_id }}
          RELEASE_VERSION: ${{ steps.candidate.outputs.release_version }}
        run: |
          $env:MILIASTRA_MCP_ROOT = (Resolve-Path ../miliastra-mcp).Path
          node ../control/scripts/gil-candidate.mjs deliver
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.candidate.outputs.build == 'true' && steps.candidate.outputs.archive != 'true' && steps.candidate.outputs.early_test != 'true'
        with:
          name: gil-build-evidence-${{ github.sha }}
          path: source/build/gil-artifact/manifest.json
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        id: upload
        if: steps.candidate.outputs.build == 'true' && (steps.candidate.outputs.archive == 'true' || steps.candidate.outputs.early_test == 'true')
        with:
          name: ${{ steps.candidate.outputs.artifact_name }}
          path: source/build/gil-artifact/
          if-no-files-found: error
          retention-days: ${{ steps.candidate.outputs.early_test == 'true' && 14 || 90 }}
          compression-level: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: steps.upload.outputs.artifact-id != ''
        with:
          artifact-ids: ${{ steps.upload.outputs.artifact-id }}
          path: source/build/gil-readback/
      - name: Verify the archived download
        if: steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          GIL_EARLY_TEST_ARTIFACT: ${{ steps.candidate.outputs.early_test }}
        run: |
          node control/scripts/gil-candidate.mjs readback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $label = if ($env:GIL_EARLY_TEST_ARTIFACT -eq 'true') { 'Download the verified device-test GIL' } else { 'Download the verified GIL' }
          "[$label]($env:ARTIFACT_URL) (artifact ID $env:ARTIFACT_ID)" >> $env:GITHUB_STEP_SUMMARY
